name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint (ruff, scope in ruff.toml)
        run: ruff check .
      - name: Layout and no public grade
        run: python -m unittest tests.test_smoke -v
      - name: Results regenerate from the code
        run: python -m unittest tests.test_results_regenerate -v
      - name: All tests
        run: python -m unittest discover -s tests -v
      - name: Learn run
        run: python level-1-learn/run_learn.py
      - name: Build run
        run: python level-2-build/run_build.py
      - name: Deep run (timing changes per run; the deterministic section is checked above)
        run: python level-3-deep/run_deep.py
      - name: Learn and Build results unchanged by their runners
        run: git diff --exit-code level-1-learn/results_learn.json level-2-build/results_build.json
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - name: Known-answer check and build
        run: npm run build
        working-directory: site
